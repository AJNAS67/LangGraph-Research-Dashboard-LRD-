services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lrd-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lrd_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lrd_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  research-runner:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lrd-research-runner
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts

volumes:
  pgdata:
    driver: local
